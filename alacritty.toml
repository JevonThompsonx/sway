
[terminal.shell]
program = "/usr/bin/fish"
args = ["--login"]

[selection]
save_to_clipboard = true

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = "Underline"

[env]
TERM = "xterm-256color"

[font]
size = 14.0 
[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Regular"  # or omit if you don’t need true italic

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold"

# Adjust font size


[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[window]
dynamic_title = true
decorations = "buttonless"
decorations_theme_variant = "Dark"
dynamic_padding = true
opacity = 0.5
title = "Alacritty"
startup_mode= "Maximized"
[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.dimensions]
columns = 100
lines = 30

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/themes/flat_remix.toml"
]
[terminal]


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
