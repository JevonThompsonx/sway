[main]
font=FiraCode Nerd Font:size=14
dpi-aware=yes
pad=5x5
shell=fish

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=firefox --new-tab {url}
label-letters=sadfjklewcmpgh

# Match Hyprland's rgba(33ccffee) active border color
[colors-dark]
background=000000
foreground=ffffff
cursor=00ff00 000000
alpha=0.5
regular0=000000
regular1=ff0000
regular2=00ff00
regular3=ffff00
regular4=0000ff
regular5=ff00ff
regular6=00ffff
regular7=ffffff
bright0=808080
bright1=ffa500
bright2=90ee90
bright3=ffffe0
bright4=add8e6
bright5=ffc0cb
bright6=00ffff
bright7=ffffff

[key-bindings]
scrollback-up-line=Shift+Up
scrollback-down-line=Shift+Down
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+Shift+plus
font-decrease=Control+Shift+minus
font-reset=Control+Shift+0
search-start=Control+Shift+f
show-urls-launch=Control+Shift+o
